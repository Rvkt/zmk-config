# ----------------------------------------------------------------------
# Corne Keyboard Configuration (ZMK)
# ----------------------------------------------------------------------

# Set keyboard broadcast name (Max 16 characters for BLE advertisement)
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Display support (OLED SSD1306 or nice!view)
# Note: If your Corne has NO screens installed, comment out CONFIG_ZMK_DISPLAY
# to save battery by preventing empty I2C polling cycles.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Power Management & Deep Sleep
# - Board enters low-power idle after 30s (display turns off)
# - Board enters deep sleep after 30 minutes of inactivity (1,800,000 ms)
# In deep sleep, power consumption drops from ~1.5mA to ~20µA, preserving
# battery health on small 110mAh LiPo cells.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth Transmit Power & Connectivity Stability
# Maximize TX power (+8 dBm) for rock-solid split communication through desks/cases
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE connectivity improvements (forces stable 1M PHY, eliminating
# split desync and connection stutter on macOS, Windows 11, and Linux)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Battery Monitoring across split halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Switch Debouncing (Prevents key chatter / double-typing on mechanical sockets)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment to enable RGB Underglow if your board has LEDs installed
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment to enable ZMK Studio runtime keymap editing
# CONFIG_ZMK_STUDIO=y
