# ----------------------------------------------------------------------
# Corne Keyboard Configuration (ZMK)
# ----------------------------------------------------------------------

# Set board name
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Display support (OLED / nice!view)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Enable deep sleep support (timeout in ms: 3600000ms = 1 hour)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Increase Bluetooth transmit power for stable split communication
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report battery level for both split halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Uncomment to enable RGB Underglow if your board has LEDs
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
