# ======================================================================
# Corne Keyboard Configuration (ZMK)
# Hardware:
#   - Controller: nice!nano v2 (Nordic nRF52840)
#   - Shield: Corne / CRKBD (split, 6x3+3 = 42 keys)
#   - Display: Dual SSD1306 128x32 OLED
#   - Underglow / Backlight: 27 WS2812 / SK6812 LEDs per half
# ======================================================================

# ----------------------------------------------------------------------
# 1. BATTERY CONFIGURATION
# ----------------------------------------------------------------------
# Battery level reporting interval in seconds (60 seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ----------------------------------------------------------------------
# 2. KEY SCANNING & DEBOUNCE
# ----------------------------------------------------------------------
# 5ms press / 5ms release — prevents chatter on mechanical hotswap sockets
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ----------------------------------------------------------------------
# 3. DEVICE IDENTIFICATION
# ----------------------------------------------------------------------
# Bluetooth broadcast keyboard name (max 16 characters for BLE advertisement)
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# ----------------------------------------------------------------------
# 4. BLUETOOTH / GATT CONFIGURATION
# ----------------------------------------------------------------------
# Maximize TX power (+8 dBm) for stable split communication through desks/cases
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable GATT subscription enforcement (compatibility fix for Windows battery reporting)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ----------------------------------------------------------------------
# 5. OLED / DISPLAY CONFIGURATION (SSD1306 128x32)
# ----------------------------------------------------------------------
# Enable ZMK display support
CONFIG_ZMK_DISPLAY=y

# Run display updates on a dedicated work queue to prevent key scan latency
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Show battery percentage as a text percentage instead of icon-only
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Show the currently active keyboard layer name
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Show peripheral (right half) connection and status
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y

# Optional display widgets (uncomment if supported by your widget build)
# CONFIG_ZMK_WIDGET_WPM_STATUS=y
# CONFIG_ZMK_WIDGET_BONGO_CAT=y

# ----------------------------------------------------------------------
# 6. POWER MANAGEMENT & DEEP SLEEP
# ----------------------------------------------------------------------
# Idle state timeout (milliseconds): 600000 ms = 10 minutes (screens and RGB auto-off)
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Deep sleep timeout (milliseconds): 900000 ms = 15 minutes (drops power to ~20µA)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ----------------------------------------------------------------------
# 7. MOUSE / POINTING DEVICE
# ----------------------------------------------------------------------
# Enable pointing device emulation for MOUSE layer (Layer 6)
CONFIG_ZMK_POINTING=y

# ----------------------------------------------------------------------
# 8. ZMK STUDIO (Live remapping via zmk.studio over USB)
# ----------------------------------------------------------------------
# Enable ZMK Studio support
CONFIG_ZMK_STUDIO=y

# Disable Studio locking (remap without explicit lock state)
CONFIG_ZMK_STUDIO_LOCKING=n

# Do not automatically lock Studio when disconnected
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ----------------------------------------------------------------------
# 9. RGB UNDERGLOW (27 WS2812 LEDs)
# ----------------------------------------------------------------------
# Enable RGB underglow subsystem
CONFIG_ZMK_RGB_UNDERGLOW=y

# Automatically turn off RGB when keyboard goes idle to preserve battery
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Default startup RGB effect (3 = wave/ripple; 0-5 selectable)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Cap maximum brightness at 60% to protect LEDs and conserve battery power
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# RGB powered from onboard regulator, not ext_power pin
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
