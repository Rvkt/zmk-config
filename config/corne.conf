# ----------------------------------------------------------------------
# Corne Keyboard Configuration (ZMK)
# Board: Nice!Nano v2 (nRF52840)
# Shield: Corne (split, 6x3+3 = 42 keys)
# Display: OLED SSD1306 128x32
# RGB: 27 WS2812 LEDs
# ----------------------------------------------------------------------

# --- Keyboard Identity ---
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# --- OLED Display (SSD1306 128x32) ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# --- Power Management & Deep Sleep ---
# Battery level reported every 60 seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Display turns off after 10 minutes of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=600000
# Deep sleep after 15 minutes (drops current from ~1.5mA to ~20µA)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Bluetooth ---
# Maximize TX power (+8 dBm) for reliable split communication through desks/cases
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Better BLE stability on Linux, Windows 11 and macOS (forces stable 1M PHY)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Show peripheral (right half) battery level on host (left half) OLED
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Fix battery reporting bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Key Scan Debounce ---
# 5ms press / 5ms release — prevents chatter on mechanical sockets
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Mouse / Pointing Device ---
# Required for the MOUSE layer (layer 6)
CONFIG_ZMK_POINTING=y

# --- ZMK Studio (live keymap editing via studio.zmk.dev) ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# --- RGB Underglow (27 WS2812 LEDs) ---
CONFIG_ZMK_RGB_UNDERGLOW=y
# Turn off RGB when keyboard goes idle (saves battery)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Start on effect 3 (wave/ripple) — change 0–5 to pick your default
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Cap brightness at 60% to protect LEDs and preserve battery
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
# RGB powered from onboard regulator, not ext_power pin
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
