---
include:
  # Standard Corne (OLED SSD1306)
  # nice_nano_v2//zmk — the //zmk qualifier is required for Zephyr 4.1+ (ZMK board variant)
  - board: nice_nano_v2//zmk
    shield: corne_left
    artifact-name: corne_left-nice_nano_v2-zmk
  - board: nice_nano_v2//zmk
    shield: corne_right
    artifact-name: corne_right-nice_nano_v2-zmk

  # Corne with nice!view displays
  - board: nice_nano_v2//zmk
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne_left_nice_view-nice_nano_v2-zmk
  - board: nice_nano_v2//zmk
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_right_nice_view-nice_nano_v2-zmk

  # Settings reset (clears corrupt BLE bonds / split pairing issues)
  - board: nice_nano_v2//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano_v2-zmk
